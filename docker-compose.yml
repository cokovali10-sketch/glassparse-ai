# Full GlassParse AI dev stack: Go engine + Qdrant vector DB for RAG.
#
# Quick start:
#   docker compose up -d --build
#   curl -s -X POST "http://localhost:8080/api/parse?url=https://example.com"
#   # RAG export targets qdrant at localhost:6333 (see python/examples/rag_pipeline.py)

services:
  glassparse-engine:
    build: ./engine
    image: glassparse-engine:latest
    container_name: glassparse-engine
    ports:
      - "8080:8080"
    environment:
      GLASSPARSE_ADDR: "0.0.0.0:8080"
      GLASSPARSE_TIMEOUT_S: "45"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/api/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped
    networks:
      - glassparse

  qdrant:
    image: qdrant/qdrant:latest
    container_name: glassparse-qdrant
    ports:
      - "6333:6333"  # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - glassparse

volumes:
  qdrant_data:
    driver: local

networks:
  glassparse:
    driver: bridge