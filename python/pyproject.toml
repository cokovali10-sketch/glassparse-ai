[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glassparse"
version = "0.1.0"
description = "Async Python SDK for the GlassParse AI web-parsing engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GlassParse AI" }]
dependencies = [
    "pydantic>=2.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Development / testing toolchain.
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4",
    "ruff>=0.4",
    "qdrant-client>=1.9",
    "chromadb>=0.4",
]
# RAG / vector-store exporters + retrievers.
rag = ["qdrant-client>=1.9", "chromadb>=0.4"]
# FAQ: install the SDK extra with:
#   pip install -e ".[dev]"      -> everything for contributors
#   pip install -e ".[rag]"       -> SDK + Qdrant/Chroma for production RAG

[project.scripts]
# `python -m glassparse` also works; a console script is friendlier.
glassparse = "glassparse.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["glassparse*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]